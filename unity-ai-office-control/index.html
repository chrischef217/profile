<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Unity Global AI Office Control</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1016;color:#edf2f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.hide{display:none!important}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login>div{width:min(420px,100%);padding:26px;background:#121a23;border:1px solid #2e3a47;border-radius:14px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:10px;background:#3adc91;color:#062015;font-weight:900}h1{font-size:17px}.muted{color:#95a2af;font-size:11px;line-height:1.5}.field{width:100%;padding:10px;border:1px solid #354351;border-radius:8px;background:#080d12;color:#fff}.btn{padding:9px 12px;border-radius:8px;border:1px solid #354351;background:#1a2530;color:#fff}.primary{background:#3adc91;border-color:#3adc91;color:#062015;font-weight:900}.danger{color:#ff7380}.top{height:62px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid #293542;background:#101720;position:sticky;top:0}.brand{display:flex;align-items:center;gap:10px}.brand .logo{width:38px;height:38px}.brand b{font-size:12px}.wrap{max-width:1400px;margin:auto;padding:14px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.metric,.card{border:1px solid #2c3946;border-radius:10px;background:#121a23}.metric{padding:10px}.metric span{display:block;color:#93a0ac;font-size:8px}.metric b{font:800 13px ui-monospace,monospace}.ok{color:#3adc91}.warn{color:#ffbd59}.bad{color:#ff6f7c}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}.stack{display:grid;gap:12px;align-content:start}.card h2{font-size:11px;margin:0;padding:11px;border-bottom:1px solid #2c3946}.body{padding:11px}.notice{padding:9px;border:1px solid #ffbd5955;border-radius:7px;color:#ffd290;font-size:10px;margin-bottom:9px}.form{display:grid;gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:7px;justify-content:flex-end}.jobs,.events,.gates{display:grid;gap:7px;max-height:520px;overflow:auto}.job,.gate,.event{padding:9px;border:1px solid #2c3946;border-radius:7px;background:#0e151c;font-size:9px}.job header,.gate{display:flex;justify-content:space-between;gap:8px}.job h3{font-size:10px;margin:0}.job p{color:#b8c2cc}.badge{font-size:7px;border:1px solid currentColor;border-radius:4px;padding:2px 4px}.tabs{display:flex;gap:5px;padding:8px}.tab{border:0;background:transparent;color:#93a0ac;font-size:8px}.tab.on{color:#3adc91}.toast{position:fixed;right:12px;bottom:12px;padding:10px;background:#131c25;border:1px solid #3adc91;border-radius:8px;font-size:10px}@media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.metrics{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
</style></head><body>
<section id="login" class="login"><div><div class="logo">UG</div><h1>AI OFFICE SECURE CONTROL</h1><p class="muted">실제 업무 큐·모델·승인·비용을 관리합니다.</p><form id="loginForm" class="form"><input id="pass" class="field" type="password" placeholder="관리자 패스코드" required><button class="btn primary">로그인</button><small id="loginMsg" class="bad"></small></form></div></section>

<article class="card"><div class="tabs"><button class="tab on" data-tab="active">ACTIVE</button><button class="tab" data-tab="approval">APPROVAL</button><button class="tab" data-tab="results">RESULTS</button></div><div class="body"><div id="jobs" class="jobs"></div></div></article>
</div><div class="stack">
<article class="card"><h2>ACTIVATION PREFLIGHT</h2><div class="body"><div id="gates" class="gates"></div></div></article>
<article class="card"><h2>MODEL & BUDGET</h2><div class="body"><form id="budgetForm" class="form"><div class="two"><input id="daily" class="field" type="number" min=".01" step=".01" placeholder="일일 THB" required><input id="monthly" class="field" type="number" min=".01" step=".01" placeholder="월간 THB" required></div><button class="btn">예산 저장</button></form><hr style="border:0;border-top:1px solid #2c3946"><select id="models" class="field"></select><div class="actions" style="margin-top:8px"><button id="sched" class="btn">스케줄러</button><button id="modelOff" class="btn danger">모델 중지</button><button id="modelOn" class="btn primary">모델 활성화</button></div></div></article>

</div></section></main></section><div id="toast" class="toast hide"></div>
<script>
const A='https://ckzwmimmwdnmpohgvcka.supabase.co/functions/v1/unity-ai-office-prod',$=x=>document.getElementById(x);let T=sessionStorage.getItem('ug_ai_token')||'',S={},P={},tab='active',busy=false;const terminal=['COMPLETED','BLOCKED','FAILED','CANCELLED'],e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(x,b=false){let z=$('toast');z.textContent=x;z.style.borderColor=b?'#ff6f7c':'#3adc91';z.classList.remove('hide');setTimeout(()=>z.classList.add('hide'),3500)}async function api(p,o={}){let h=new Headers(o.headers||{});if(T)h.set('authorization','Bearer '+T);if(o.body)h.set('content-type','application/json');let r=await fetch(A+p,{...o,headers:h,cache:'no-store'}),d=await r.json().catch(()=>({error:'INVALID_RESPONSE'}));if(r.status===401&&p!='/admin/login')out();if(!r.ok||d.ok===false)throw Error(d.error||'HTTP_'+r.status);return d}function out(){T='';sessionStorage.removeItem('ug_ai_token');$('app').classList.add('hide');$('login').classList.remove('hide')}function cls(x,v){x.textContent=v;x.className=v==='PASS'||v==='CONFIGURED'||v==='ACTIVE'||v==='ENABLED'?'ok':v==='BLOCKED'||v==='MISSING'?'bad':'warn'}
async function load(){if(busy)return;busy=true;try{[S,P]=await Promise.all([api('/state'),api('/admin/preflight')]);render()}catch(x){toast(x.message,true)}finally{busy=false}}function render(){let g=P.gates,u=S.usage_summary?.monthly||{};cls($('mKey'),g.openai_secret?'CONFIGURED':'MISSING');cls($('mModel'),S.execution?.model_enabled?'ENABLED':'DISABLED');cls($('mSched'),S.settings?.workday_enabled?'ACTIVE':'PAUSED');$('mQueue').textContent=S.queue||0;$('mCost').textContent=Number(u.estimated_cost_thb||0).toFixed(2)+' THB';let blocks=[];if(!g.openai_secret)blocks.push('OPENAI_API_KEY');if(!g.budget_limits_set)blocks.push('예산');if(!g.model_execution_enabled)blocks.push('모델 활성화');$('notice').textContent=P.ready_for_execution?'실제 AI 실행 활성화됨':'현재 차단: '+blocks.join(' / ');let labels={secure_admin_api:'보안 API',openai_secret:'OpenAI 키',administrator_configured:'관리자 인증',scheduler_enabled:'스케줄러',model_profile_selected:'모델 프로필',selected_model_pricing_verified:'검증 가격',budget_limits_set:'비용 한도',external_tool_execution_disabled:'외부도구 차단',model_execution_enabled:'모델 실행'};$('gates').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="gate"><span>${v}</span><b class="${g[k]?'ok':'bad'}">${g[k]?'PASS':'BLOCKED'}</b></div>`).join('')+`<div class="gate"><span>컨텍스트 / Capability</span><b>${g.active_context_packages} / ${g.active_capabilities}</b></div>`;$('daily').value=S.budget_policy?.daily_cost_limit_thb??'';$('monthly').value=S.budget_policy?.monthly_cost_limit_thb??'';$('models').innerHTML=(S.model_registry||[]).map(m=>`<option value="${e(m.model_key)}">${e(m.model_key)} · ${e(m.model_name)}</option>`).join('');let cm=(S.model_registry||[]).find(m=>m.model_name===S.execution?.model_name);if(cm)$('models').value=cm.model_key;$('template').innerHTML='<option value="">직접 지시</option>'+(S.templates||[]).map(t=>`<option value="${e(t.template_key)}">${e(t.name)} · ${e(t.agent_id)}</option>`).join('');$('sched').textContent=S.settings?.workday_enabled?'스케줄러 중지':'스케줄러 활성화';jobs();$('events').innerHTML=(S.events||[]).slice(0,35).map(x=>`<div class="event"><b>${e(x.event_type)}</b><br>${e(x.message)}<br><span class="muted">${e(x.agent_id||'SYSTEM')} · ${new Date(x.created_at).toLocaleString('ko-KR',{timeZone:'Asia/Bangkok'})}</span></div>`).join('')||'<div class="muted">기록 없음</div>'}
function selectedJobs(){if(tab==='approval')return S.jobs.filter(j=>j.status==='WAITING_APPROVAL');if(tab==='results')return S.jobs.filter(j=>terminal.includes(j.status));return S.jobs.filter(j=>!terminal.includes(j.status)&&j.status!=='WAITING_APPROVAL')}function output(j){return j.result?.output_text||j.result?.reason||j.error_message||''}function jobs(){$('jobs').innerHTML=selectedJobs().slice(0,70).map(j=>{let a='';if(j.status==='WAITING_APPROVAL')a=`<button data-a="approve" data-id="${j.id}" class="btn primary">승인</button><button data-a="reject" data-id="${j.id}" class="btn danger">거부</button>`;else if(terminal.includes(j.status)&&j.status!=='COMPLETED')a=`<button data-a="retry" data-id="${j.id}" class="btn">재시도</button>`;return `<article class="job"><header><h3>${e(j.title)}</h3><span class="badge ${j.status==='COMPLETED'?'ok':j.status==='WAITING_APPROVAL'?'warn':terminal.includes(j.status)?'bad':''}">${e(j.status)}</span></header><p>${e(j.owner_agent_id)} · ${e(j.capability_key)} · ${e(j.phase||'')}</p>${output(j)?`<p>${e(output(j)).slice(0,1000)}</p>`:''}<div class="actions">${a}</div></article>`}).join('')||'<div class="muted">해당 업무 없음</div>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.id))}
async function act(a,id){try{await api('/'+a,{method:'POST',body:JSON.stringify({job_id:id})});toast('처리 완료: '+a);await load()}catch(x){toast(x.message,true)}}$('loginForm').onsubmit=async ev=>{ev.preventDefault();$('loginMsg').textContent='';try{let d=await api('/admin/login',{method:'POST',body:JSON.stringify({passcode:$('pass').value})});T=d.token;sessionStorage.setItem('ug_ai_token',T);$('pass').value='';$('login').classList.add('hide');$('app').classList.remove('hide');await load()}catch(x){$('loginMsg').textContent=x.message}};$('cmdForm').onsubmit=async ev=>{ev.preventDefault();let c=$('command').value.trim(),k=$('template').value;if(!c&&!k)return;try{await api('/command',{method:'POST',body:JSON.stringify({command:c,template_key:k})});$('command').value='';toast('업무 등록 완료');await load()}catch(x){toast(x.message,true)}};$('budgetForm').onsubmit=async ev=>{ev.preventDefault();try{await api('/admin/budget',{method:'POST',body:JSON.stringify({daily_cost_limit_thb:+$('daily').value,monthly_cost_limit_thb:+$('monthly').value})});toast('예산 저장 완료');await load()}catch(x){toast(x.message,true)}};$('modelOn').onclick=async()=>{try{await api('/admin/model',{method:'POST',body:JSON.stringify({enabled:true,model_key:$('models').value})});toast('모델 활성화 완료');await load()}catch(x){toast(x.message,true)}};$('modelOff').onclick=async()=>{try{await api('/admin/model',{method:'POST',body:JSON.stringify({enabled:false,model_key:$('models').value})});toast('모델 중지 완료');await load()}catch(x){toast(x.message,true)}};$('sched').onclick=async()=>{try{await api('/admin/workday',{method:'POST',body:JSON.stringify({enabled:!S.settings?.workday_enabled})});await load()}catch(x){toast(x.message,true)}};$('runNow').onclick=async()=>{try{await api('/admin/run-now',{method:'POST'});toast('Runner 실행 요청 완료');setTimeout(load,1500)}catch(x){toast(x.message,true)}};$('refresh').onclick=load;$('logout').onclick=async()=>{try{await api('/admin/logout',{method:'POST'})}catch{}out()};document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;document.querySelectorAll('.tab').forEach(y=>y.classList.toggle('on',y===x));jobs()});(async()=>{if(T)try{await api('/admin/session');$('login').classList.add('hide');$('app').classList.remove('hide');await load()}catch{out()}})();setInterval(()=>{if(T)load()},15000);
</script></body></html>
