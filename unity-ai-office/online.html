<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unity Global AI Office</title><style>
:root{--g:#00ff41;--bg:#040608;--line:#ffffff18;--dim:#82909e;--warn:#ffb020;--danger:#ff4d61}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#e7edf3;font:13px system-ui}button,input{font:inherit}button{cursor:pointer}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#05080bf5}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;background:var(--g);color:#001706;font-weight:1000;box-shadow:0 0 22px #00ff4155}.brand small{display:block;color:var(--dim);font-size:8px}.stats{display:flex;gap:7px}.stat{padding:7px 10px;border:1px solid #00ff4130;border-radius:8px}.stat b{color:var(--g);margin-left:7px}.top button{height:34px;border:1px solid var(--line);border-radius:8px;background:#ffffff08;color:#fff;font-size:9px}.bar{height:29px;padding:7px 18px;border-bottom:1px solid var(--line);color:var(--dim);font-size:9px}.bar .live{color:var(--g)}.bar .warn{float:right;color:var(--warn)}.app{height:calc(100% - 99px);display:grid;grid-template-columns:1fr 400px}.office{display:flex;flex-direction:column;border-right:1px solid var(--line)}.scene{flex:1;display:grid;place-items:center;overflow:hidden}.world{height:96%;aspect-ratio:512/544;position:relative;border:1px solid #00ff4140;border-radius:8px;overflow:hidden;box-shadow:0 20px 60px #000}.world>img{width:100%;height:100%;image-rendering:pixelated}.world:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse,transparent 55%,#0008);pointer-events:none}.agents{position:absolute;inset:0;z-index:3}.agent{position:absolute;transform:translate(-50%,-50%);width:56px;text-align:center;transition:.5s;cursor:pointer}.agent .icon{width:34px;height:34px;display:grid;place-items:center;margin:auto;border:1px solid var(--c);border-radius:12px;background:#03070ae8;font-size:20px;box-shadow:0 0 12px var(--c);animation:bob 2s ease-in-out infinite alternate}.agent .name{margin-top:3px;padding:2px 4px;border-radius:4px;background:#03070ae8;border:1px solid var(--c);font-size:7px;font-weight:900}.agent .bubble{position:absolute;left:50%;bottom:55px;transform:translateX(-50%);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;padding:5px 7px;border-radius:8px;background:#03070af5;border:1px dashed var(--c);font-size:8px}.agent.busy .icon{animation:work .35s steps(2) infinite}.agent.busy .bubble,.agent.flash .bubble{opacity:1}.agent.flash{filter:brightness(1.8);animation:flash .7s 3}.agent.approval .icon{animation:alarm .6s infinite}@keyframes bob{to{transform:translateY(-3px)}}@keyframes work{50%{transform:translateY(-5px) rotate(5deg)}}@keyframes flash{50%{filter:brightness(2)}}@keyframes alarm{50%{transform:scale(1.25);box-shadow:0 0 22px var(--warn)}}.pulse{display:none;position:absolute;left:50%;bottom:10%;transform:translateX(-50%);z-index:5;padding:7px 11px;border:1px solid #00ff4188;border-radius:18px;background:#00ff4120;color:var(--g);font-weight:900;font-size:9px}.pulse.on{display:block;animation:up 2.2s forwards}@keyframes up{0%{opacity:0;transform:translate(-50%,15px)}15%,80%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px)}}.dock{min-height:104px;padding:10px 14px;border-top:1px solid var(--line);background:#05070a}.dockhead{display:flex;justify-content:space-between;color:var(--dim);font-size:8px;margin-bottom:6px}.dockhead b{color:var(--g)}.cmd{display:grid;grid-template-columns:1fr 110px;gap:7px}.cmd input{height:40px;border:1px solid #00ff4140;border-radius:8px;background:#020405;color:#fff;padding:0 12px;outline:none}.cmd button{border:0;border-radius:8px;background:var(--g);color:#001706;font-weight:1000}.cmd button:disabled{opacity:.5}.feedback{height:18px;margin-top:5px;color:var(--dim);font-size:8px}.feedback.ok{color:var(--g)}.feedback.err{color:var(--danger)}.side{display:flex;flex-direction:column;min-height:0;background:#06090d}.tabs{display:grid;grid-template-columns:repeat(4,1fr)}.tab{height:38px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--dim);font-size:7px;font-weight:900}.tab.on{color:var(--g);background:#00ff4110;border-bottom:2px solid var(--g)}.panel{display:none;flex:1;overflow:auto;padding:9px}.panel.on{display:block}.card{padding:9px;margin-bottom:7px;border:1px solid var(--line);border-radius:8px;background:#ffffff08;transition:.2s}.card.click{cursor:pointer}.card.click:hover{border-color:#00ff4188}.card.new{animation:newcard .8s 3}@keyframes newcard{50%{border-color:var(--g);box-shadow:0 0 18px #00ff4133}}.card h4{margin:0;font-size:10px}.card p{margin:5px 0;color:#a9b4bf;font-size:9px}.card small{color:var(--dim);font-size:7px}.badge{float:right;color:var(--g);font-size:7px}.BLOCKED,.FAILED,.CANCELLED{color:var(--danger)}.WAITING_APPROVAL{color:var(--warn)}.note{padding:10px;border-top:1px solid var(--line);color:var(--dim);font-size:8px}.note b{color:var(--g)}.note em{color:var(--warn);font-style:normal}.toasts{position:fixed;right:16px;top:110px;z-index:50}.toast{min-width:270px;margin-bottom:7px;padding:10px 12px;border:1px solid #00ff4166;border-radius:9px;background:#071018f5;box-shadow:0 15px 35px #000;font-size:10px}.toast b{display:block;color:var(--g);margin-bottom:3px}.toast.err{border-color:#ff4d6188}.toast.err b{color:var(--danger)}.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#000c}.modal[hidden]{display:none}.box{width:min(560px,92vw);max-height:85vh;overflow:auto;padding:20px;border:1px solid #00ff4155;border-radius:14px;background:#0b1117}.box pre{white-space:pre-wrap}.actions{display:flex;gap:8px;justify-content:flex-end}.actions button{padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:#111923;color:#fff}@media(max-width:760px){.stats{display:none}.app{display:block;height:auto}.office{height:calc(100vh - 99px)}.side{height:650px}.world{width:94%;height:auto}.toasts{left:10px;right:10px}.toast{min-width:0}.tabs{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header class="top"><div class="brand"><div class="logo">UG</div><div><b>UNITY GLOBAL AI OFFICE</b><small>CONTROL STAGE 6 · REACTIVE DEV BUILD</small></div></div><div class="stats"><div class="stat">AGENTS <b id="ac">0</b></div><div class="stat">ACTIVE <b id="active">0</b></div><div class="stat">APPROVAL <b id="ap">0</b></div><div class="stat">QUEUE <b id="q">0</b></div></div><div><button id="scheduler">● 24H</button> <button id="refresh">↻ REFRESH</button></div></header><div class="bar"><span class="live">● ONLINE</span> · <span id="runtime">연결 중</span> · <span id="model">MODEL CHECKING</span> · <span id="clock"></span><span class="warn">개발 중 · 비밀번호 없음</span></div><main class="app"><section class="office"><div class="scene"><div class="world"><img src="https://raw.githubusercontent.com/wonseokjung/connect-ai/main/assets/pixel/office/Office_Design_2.gif" alt="AI Office"><div id="agents" class="agents"></div><div id="pulse" class="pulse">업무 배정 완료</div></div></div><div class="dock"><div class="dockhead"><span>⌘ MANAGING DIRECTOR COMMAND</span><b id="state">READY</b></div><div class="cmd"><input id="command" placeholder="업무를 입력하거나 오른쪽 TEMPLATES에서 선택하십시오"><button id="send">업무 배정</button></div><div id="feedback" class="feedback">버튼을 누르면 담당 에이전트와 작업 상태가 즉시 표시됩니다.</div></div></section><aside class="side"><nav class="tabs"><button class="tab on" data-p="activity">ACTIVITY</button><button class="tab" data-p="jobs">JOBS</button><button class="tab" data-p="templates">TEMPLATES</button><button class="tab" data-p="context">CONTEXT</button><button class="tab" data-p="governance">GOVERNANCE</button><button class="tab" data-p="results">RESULTS</button><button class="tab" data-p="approval">APPROVAL</button></nav><div id="activity" class="panel on"></div><div id="jobs" class="panel"></div><div id="templates" class="panel"></div><div id="context" class="panel"></div><div id="governance" class="panel"></div><div id="results" class="panel"></div><div id="approval" class="panel"></div><div class="note"><b>화면·큐 반응 활성화</b><br><em>실제 AI 결과 생성은 모델 키 연결 전까지 BLOCKED 처리됩니다.</em></div></aside></main><div id="toasts" class="toasts"></div><div id="modal" class="modal" hidden><div class="box"><button id="close">닫기</button><h2 id="mt"></h2><p id="mm"></p><pre id="mr"></pre><div id="ma" class="actions"></div></div></div><script>
const API='https://ckzwmimmwdnmpohgvcka.supabase.co/functions/v1/unity-ai-office-dev-open',P={pmo:[88,88],design:[64,38],dev:[28,58],sales:[28,38],product:[46,38],marketing:[82,38],finance:[82,58],admin:[70,78],research:[50,78],audit:[18,78]},C={pmo:'#00ff41',design:'#a78bfa',dev:'#22d3ee',sales:'#ff7a59',product:'#38bdf8',marketing:'#e1306c',finance:'#fbbf24',admin:'#84cc16',research:'#60a5fa',audit:'#fb7185'};let D={agents:[],jobs:[],events:[],templates:[],contexts:[],capabilities:[],tool_policies:[]},T=null,J=null,last=null;const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){let h=new Headers(o.headers||{});if(o.body)h.set('content-type','application/json');let r=await fetch(API+p,{...o,headers:h,cache:'no-store'}),d=await r.json().catch(()=>({error:'HTTP_'+r.status}));if(!r.ok||d.ok===false)throw Error(d.error||'HTTP_'+r.status);return d}function toast(t,m,err=false){let x=document.createElement('div');x.className='toast'+(err?' err':'');x.innerHTML=`<b>${e(t)}</b>${e(m)}`;$('toasts').appendChild(x);setTimeout(()=>x.remove(),4000)}function tab(n){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.p===n));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===n))}function cap(k){return D.capabilities.find(x=>x.capability_key===k)?.name||k||'—'}function activeJob(id){return D.jobs.find(j=>j.owner_agent_id===id&&['QUEUED','APPROVED','RUNNING','WAITING_APPROVAL'].includes(j.status))}function card(t,s,p,m,id='',tk=''){return `<article class="card ${id?'click':''} ${id===last?'new':''}" ${id?`data-j="${id}"`:''} ${tk?`data-t="${tk}"`:''}><span class="badge ${e(s)}">${e(s)}</span><h4>${e(t)}</h4><p>${e(p)}</p><small>${e(m)}</small></article>`}function render(){let a=$('agents');a.innerHTML='';D.agents.forEach(x=>{let p=P[x.id]||[50,50],j=activeJob(x.id),s=j?.status||x.status||'IDLE',busy=['QUEUED','APPROVED','RUNNING'].includes(s),n=document.createElement('div');n.className='agent '+(busy?'busy ':'')+(s==='WAITING_APPROVAL'?'approval ':'');n.dataset.agent=x.id;n.style.cssText=`left:${p[0]}%;top:${p[1]}%;--c:${C[x.id]||'#00ff41'}`;n.innerHTML=`<div class="bubble">${e(j?.title||x.current_task||'대기 중')}</div><div class="icon">${e(x.emoji||'🤖')}</div><div class="name">${e(x.name)} · ${e(s)}</div>`;n.onclick=()=>{toast(x.name,j?.title||x.current_task||'대기 중')};a.appendChild(n)});$('ac').textContent=D.agents.length;$('active').textContent=D.agents.filter(x=>activeJob(x.id)).length;$('ap').textContent=D.approvals||0;$('q').textContent=D.queue||0;$('activity').innerHTML=D.events.map(x=>card(x.agent_id||x.event_type,x.event_type,x.message,new Date(x.created_at).toLocaleTimeString('ko-KR'))).join('')||card('활동 없음','','새 이벤트가 표시됩니다.','');$('jobs').innerHTML=D.jobs.filter(x=>!['COMPLETED','BLOCKED','FAILED','CANCELLED','WAITING_APPROVAL'].includes(x.status)).map(x=>card(x.owner_agent_id,x.status,x.title,cap(x.capability_key),x.id)).join('')||card('업무 없음','','등록된 일반 업무가 없습니다.','');$('templates').innerHTML=D.templates.map(x=>card(x.name,x.category,x.description,cap(x.capability_key),'',x.template_key)).join('')||card('템플릿 없음','','활성 템플릿이 없습니다.','');$('context').innerHTML=D.contexts.map(x=>card(x.context_key,'P'+x.priority,(x.source_files||[]).join(' · '),x.category)).join('')||card('컨텍스트 없음','','활성 컨텍스트가 없습니다.','');let ex=D.execution||{},u=D.usage_summary||{};$('governance').innerHTML=card('MODEL EXECUTION',ex.model_enabled?'ENABLED':'BLOCKED',(ex.model_provider||'NONE')+' · '+(ex.model_name||'UNSET'),ex.disabled_reason||'')+card('USAGE / BUDGET','HARD STOP',`오늘 토큰 ${u.daily?.total_tokens||0} · 비용 ${u.daily?.estimated_cost_thb||0} THB`,`Tool Policy ${(D.tool_policies||[]).length}`);$('results').innerHTML=D.jobs.filter(x=>['COMPLETED','BLOCKED','FAILED','CANCELLED'].includes(x.status)).map(x=>card(x.owner_agent_id,x.status,x.title,cap(x.capability_key),x.id)).join('')||card('결과 없음','','완료 또는 차단 결과가 없습니다.','');$('approval').innerHTML=D.jobs.filter(x=>x.status==='WAITING_APPROVAL').map(x=>card(x.owner_agent_id,x.status,x.title,cap(x.capability_key),x.id)).join('')||card('승인 대기 없음','','위험 업무가 없습니다.','');document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{let t=D.templates.find(y=>y.template_key===x.dataset.t);T=t.template_key;$('command').value=t.command_template;$('state').textContent='TEMPLATE → '+t.name;toast('템플릿 선택',t.name)});document.querySelectorAll('[data-j]').forEach(x=>x.onclick=()=>openJob(x.dataset.j));$('model').textContent=ex.model_enabled?`MODEL ${ex.model_provider}/${ex.model_name}`:`MODEL BLOCKED/${ex.disabled_reason||'NOT CONFIGURED'}`;$('scheduler').textContent=D.settings?.workday_enabled?'● 24H ACTIVE':'○ PAUSED'}async function load(silent=false){try{D=await api('/state');$('runtime').textContent=`Capability ${D.capabilities?.length||0} · Context ${D.contexts?.length||0} · ${D.access_mode||'DEV OPEN'}`;render()}catch(x){$('runtime').textContent='API ERROR '+x.message;if(!silent)toast('연결 실패',x.message,true)}}function flash(owner,title){let a=document.querySelector(`[data-agent="${owner}"]`);if(a){a.classList.add('flash','busy');a.querySelector('.bubble').textContent=title;setTimeout(()=>a.classList.remove('flash'),2500)}let p=$('pulse');p.textContent=owner.toUpperCase()+' 에이전트에게 업무 배정';p.classList.remove('on');void p.offsetWidth;p.classList.add('on')}async function send(){let command=$('command').value.trim();if(!command&&!T){$('feedback').textContent='업무 내용을 입력하십시오.';toast('입력 필요','업무 내용이 비어 있습니다.');return}let b=$('send');b.disabled=true;b.textContent='배정 중…';$('state').textContent='DISPATCHING';$('feedback').textContent='서버에 업무 등록 중…';try{let d=await api('/command',{method:'POST',body:JSON.stringify({command,template_key:T||undefined})});last=d.job.id;flash(d.job.owner_agent_id,d.job.title);toast('업무 배정 완료',d.job.owner_agent_id.toUpperCase()+' · '+d.job.status);$('feedback').className='feedback ok';$('feedback').textContent='업무가 등록되었습니다: '+d.job.status;$('state').textContent=d.job.status+' → '+d.job.owner_agent_id;$('command').value='';T=null;await load(true);tab(d.job.status==='WAITING_APPROVAL'?'approval':'jobs');setTimeout(()=>{last=null;render()},2500)}catch(x){$('feedback').className='feedback err';$('feedback').textContent='업무 배정 실패: '+x.message;toast('업무 배정 실패',x.message,true)}finally{b.disabled=false;b.textContent='업무 배정'}}function openJob(id){J=D.jobs.find(x=>x.id===id);$('mt').textContent=J.title;$('mm').textContent=`${J.status} · ${J.owner_agent_id||'pmo'} · ${cap(J.capability_key)} · ${J.risk_level}`;$('mr').textContent=J.result?.output_text||J.result?.reason||J.error_message||JSON.stringify(J.result||{},null,2)||'아직 결과가 없습니다.';let a=[];if(J.status==='WAITING_APPROVAL')a=['reject','approve'];else if(['BLOCKED','FAILED','CANCELLED'].includes(J.status))a=['retry'];$('ma').innerHTML=a.map(x=>`<button data-a="${x}">${x}</button>`).join('');document.querySelectorAll('[data-a]').forEach(x=>x.onclick=async()=>{await api('/'+x.dataset.a,{method:'POST',body:JSON.stringify({job_id:J.id})});$('modal').hidden=true;toast('업무 상태 변경',x.dataset.a.toUpperCase());load(true)});$('modal').hidden=false}$('send').onclick=send;$('command').onkeydown=x=>{if(x.key==='Enter')send()};$('refresh').onclick=()=>{load();toast('새로고침','최신 상태를 불러옵니다.')};$('scheduler').onclick=async()=>{let enabled=!D.settings?.workday_enabled;await api('/admin/workday',{method:'POST',body:JSON.stringify({enabled})});toast('스케줄러',enabled?'활성화':'일시정지');load(true)};$('close').onclick=()=>$('modal').hidden=true;document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>tab(x.dataset.p));setInterval(()=>$('clock').textContent=new Date().toLocaleString('ko-KR',{timeZone:'Asia/Bangkok',hour12:false}),1000);load();setInterval(()=>load(true),15000);
</script></body></html>
