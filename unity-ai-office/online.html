<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Unity Global AI Office</title><style>
:root{--g:#00ff41;--bg:#040608;--p:#080d12;--line:rgba(255,255,255,.1);--text:#e7edf3;--dim:#82909e;--warn:#ffb020;--danger:#ff4d61;--info:#60a5fa}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}body{display:flex;flex-direction:column;background:radial-gradient(circle at 50% -20%,rgba(0,255,65,.09),transparent 45%),#040608}.top{height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(5,8,11,.96);z-index:20}.brand{display:flex;align-items:center;gap:11px}.logo{width:41px;height:41px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#9affab,var(--g) 55%,#008f11);color:#001908;font-weight:1000;box-shadow:0 0 22px rgba(0,255,65,.32)}.brand b{display:block;font-size:14px;letter-spacing:.08em}.brand small{display:block;color:var(--dim);font-size:8px;letter-spacing:.14em;margin-top:3px}.hud{display:flex;gap:7px}.stat{min-width:78px;padding:7px 10px;border:1px solid rgba(0,255,65,.18);border-radius:9px;background:rgba(0,255,65,.04);display:flex;justify-content:space-between;gap:8px}.stat span{font-size:7px;color:var(--dim)}.stat strong{color:var(--g);font-family:monospace}.actions{display:flex;justify-content:flex-end;gap:7px}.actions button{height:35px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.04);color:var(--text);font-size:9px;font-weight:800;padding:0 10px}.actions .on{border-color:var(--g);color:var(--g);background:rgba(0,255,65,.1)}.bar{height:29px;padding:0 18px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);font-size:9px;color:var(--dim)}.dot{width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);animation:blink 1.3s infinite}@keyframes blink{50%{opacity:.25}}.shell{flex:1;min-height:0;display:grid;grid-template-columns:1fr 390px}.office{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#070a0f}.frame{flex:1;min-height:0;display:grid;place-items:center;padding:13px}.stage{height:100%;max-width:100%;aspect-ratio:512/544;position:relative;overflow:hidden;border-radius:7px;background:#10151a;box-shadow:0 0 0 1px rgba(0,255,65,.25),0 22px 70px #000}.bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.stage:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse,transparent 55%,rgba(0,0,0,.52)),repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.08) 3px 4px);pointer-events:none;z-index:6}.layer{position:absolute;inset:0;z-index:10}.agent{position:absolute;transform:translate(-50%,-82%);width:52px;height:68px;cursor:pointer}.avatar{width:32px;height:42px;margin:auto;position:relative;filter:drop-shadow(0 5px 4px #000)}.head{position:absolute;left:8px;top:0;width:16px;height:15px;border-radius:5px;background:var(--skin)}.hair{position:absolute;left:7px;top:-2px;width:18px;height:8px;border-radius:6px 6px 2px 2px;background:var(--hair)}.bodyp{position:absolute;left:5px;top:14px;width:22px;height:21px;border-radius:5px;background:var(--c);box-shadow:inset 0 -5px rgba(0,0,0,.2)}.legs{position:absolute;left:8px;top:34px;width:16px;height:8px;border-left:6px solid #18202b;border-right:6px solid #18202b}.tag{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);white-space:nowrap;padding:2px 5px;border-radius:4px;background:rgba(3,7,10,.92);border:1px solid var(--c);font-size:7px;font-weight:900}.status{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:#03070a;border:1px solid var(--c);box-shadow:0 0 10px var(--c);font-size:10px}.agent.WORKING .avatar{animation:work .7s ease-in-out infinite alternate}@keyframes work{to{transform:translateY(-2px)}}.thought{position:absolute;left:50%;bottom:calc(100% + 16px);transform:translateX(-50%);opacity:0;transition:.2s;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(3,8,11,.95);border:1px dashed var(--c);border-radius:10px;padding:5px 8px;font-size:8px}.agent:hover .thought{opacity:1}.dock{min-height:92px;padding:10px 14px;border-top:1px solid var(--line);background:#05070a}.selected{display:none;font-size:8px;color:var(--g);border:1px solid rgba(0,255,65,.3);padding:5px 8px;border-radius:7px;margin-bottom:6px}.selected.on{display:flex;justify-content:space-between}.dockhead{display:flex;justify-content:space-between;font-size:8px;color:var(--dim);margin-bottom:7px}.dockhead b{color:var(--g)}.cmd{display:grid;grid-template-columns:1fr 100px;gap:7px}.cmd input{height:39px;border:1px solid rgba(0,255,65,.25);border-radius:8px;background:#020405;color:#fff;padding:0 12px}.cmd button{border:0;border-radius:8px;background:linear-gradient(135deg,#79ff8d,var(--g),#008f11);color:#001706;font-weight:1000}.side{min-height:0;display:flex;flex-direction:column;background:#06090d}.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.tab{height:38px;border:0;background:transparent;color:var(--dim);font-size:7px;font-weight:900}.tab.active{color:var(--g);background:rgba(0,255,65,.06);box-shadow:inset 0 -2px var(--g)}.panel{display:none;flex:1;overflow:auto;padding:9px}.panel.active{display:block}.card{padding:9px;margin-bottom:7px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.025)}.card.click{cursor:pointer}.card.click:hover{border-color:rgba(0,255,65,.5)}.card h4{margin:0;font-size:10px}.card p{margin:5px 0;color:#a9b4bf;font-size:9px;line-height:1.45}.card small{color:var(--dim);font-size:7px}.badge{float:right;padding:2px 4px;border-radius:4px;border:1px solid rgba(0,255,65,.25);color:var(--g);font-size:6px}.badge.WAITING_APPROVAL,.badge.APPROVED{color:var(--warn);border-color:var(--warn)}.badge.BLOCKED,.badge.FAILED{color:var(--danger);border-color:var(--danger)}.note{padding:10px;border-top:1px solid var(--line);color:var(--dim);font-size:8px;line-height:1.4}.note b{color:var(--g)}.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,5,9,.8);padding:20px}.modal[hidden]{display:none}.modalbox{width:min(620px,95vw);max-height:88vh;overflow:auto;border:1px solid rgba(0,255,65,.25);border-radius:16px;background:#0b1117;padding:22px}.modalbox pre{white-space:pre-wrap;font-size:10px;line-height:1.5}.modalactions{display:flex;gap:8px;justify-content:flex-end}.modalactions button{padding:8px 12px;border-radius:7px;border:1px solid var(--line);background:#111923;color:#fff}.modalactions .approve{background:var(--g);color:#001706}@media(max-width:900px){.top{grid-template-columns:1fr auto}.hud{display:none}.shell{grid-template-columns:1fr 320px}}@media(max-width:680px){html,body{overflow:auto}.top{height:64px;padding:8px}.brand small,.actions button:not(.on){display:none}.shell{display:block}.office{height:calc(100vh - 93px)}.side{height:620px}.stage{width:min(96%,512px);height:auto}}
</style></head><body><header class="top"><div class="brand"><div class="logo">UG</div><div><b>UNITY GLOBAL AI OFFICE</b><small>CONNECT-AI WEB PORT · CONTROL STAGE 6 · DEV OPEN</small></div></div><div class="hud"><div class="stat"><span>AGENTS</span><strong id="ac">0</strong></div><div class="stat"><span>ACTIVE</span><strong id="active">0</strong></div><div class="stat"><span>APPROVAL</span><strong id="ap">0</strong></div><div class="stat"><span>QUEUE</span><strong id="q">0</strong></div></div><div class="actions"><button id="workday" class="on">● 24H SCHEDULER</button><button id="refresh">↻ REFRESH</button><button class="on" disabled>DEV OPEN</button></div></header><div class="bar"><i class="dot"></i><span id="runtime">개발용 공개 모드 연결 중</span><span>|</span><span id="model">MODEL: CHECKING</span><span>|</span><span id="clock"></span></div><main class="shell"><section class="office"><div class="frame"><div class="stage"><img class="bg" src="https://raw.githubusercontent.com/wonseokjung/connect-ai/main/assets/pixel/office/Office_Design_2.gif"><div id="layer" class="layer"></div></div></div><div class="dock"><div id="selected" class="selected"><span id="selectedName"></span><button id="clearTemplate">×</button></div><div class="dockhead"><span>⌘ MANAGING DIRECTOR COMMAND</span><b id="cs">READY</b></div><div class="cmd"><input id="input" placeholder="업무를 지시하거나 템플릿을 선택하십시오"><button id="send">업무 배정</button></div></div></section><aside class="side"><div class="tabs"><button class="tab active" data-tab="activity">ACTIVITY</button><button class="tab" data-tab="jobs">JOBS</button><button class="tab" data-tab="templates">TEMPLATES</button><button class="tab" data-tab="context">CONTEXT</button><button class="tab" data-tab="governance">GOVERNANCE</button><button class="tab" data-tab="results">RESULTS</button><button class="tab" data-tab="approval">APPROVAL</button></div><div id="activity" class="panel active"></div><div id="jobs" class="panel"></div><div id="templates" class="panel"></div><div id="context" class="panel"></div><div id="governance" class="panel"></div><div id="results" class="panel"></div><div id="approval" class="panel"></div><div class="note"><b>ONLINE CONTROL STAGE 6 · DEVELOPMENT OPEN</b><br>Capability·Context·Tool Policy·비용 하드스톱·1분 Runner를 사용합니다.</div></aside></main><div id="jobModal" class="modal" hidden><div class="modalbox"><button id="closeModal">닫기</button><h2 id="jobTitle"></h2><p id="jobMeta"></p><pre id="jobResult"></pre><div id="jobActions" class="modalactions"></div></div></div><script>
const API='https://ckzwmimmwdnmpohgvcka.supabase.co/functions/v1/unity-ai-office-dev-open',pos={pmo:[88,88],design:[64,38],dev:[28,58],sales:[28,38],product:[46,38],marketing:[82,38],finance:[82,58],admin:[70,78],research:[50,78],audit:[18,78]},col={pmo:'#00ff41',design:'#a78bfa',dev:'#22d3ee',sales:'#ff7a59',product:'#38bdf8',marketing:'#e1306c',finance:'#fbbf24',admin:'#84cc16',research:'#60a5fa',audit:'#fb7185'},ico={WORKING:'⚙',IDLE:'·',WAITING_APPROVAL:'!',QUEUED:'…',APPROVED:'✓',DONE:'✓',REVIEWING:'⌕',ERROR:'×',OFFLINE:'○'};let D={agents:[],jobs:[],events:[],capabilities:[],templates:[],contexts:[],tool_policies:[],queue:0,approvals:0},sel=null,job=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),time=v=>v?new Date(v).toLocaleString('ko-KR',{timeZone:'Asia/Bangkok',hour12:false}):'—';async function api(path,opt={}){const h=new Headers(opt.headers||{});if(opt.body)h.set('content-type','application/json');const r=await fetch(API+path,{...opt,headers:h,cache:'no-store'}),d=await r.json().catch(()=>({error:'HTTP_'+r.status}));if(!r.ok||d.ok===false)throw Error(d.error||'HTTP_'+r.status);return d}function capName(k){return D.capabilities.find(x=>x.capability_key===k)?.name||k||'—'}function card(title,status,text,meta,id=''){return `<article class="card ${id?'click':''}" ${id?`data-job="${id}"`:''}><span class="badge ${esc(status)}">${esc(status)}</span><h4>${esc(title)}</h4><p>${esc(text)}</p><small>${esc(meta)}</small></article>`}function renderAgents(){const l=$('layer');l.innerHTML='';D.agents.forEach((a,i)=>{const p=pos[a.id]||[50,50],e=document.createElement('div');e.className='agent '+a.status;e.style.cssText=`left:${p[0]}%;top:${p[1]}%;--c:${col[a.id]||'#00ff41'};--skin:${['#d9a679','#f0c7a5','#a86f4b','#e0ad85'][i%4]};--hair:${['#17202b','#4b2e20','#1f2937','#5b3a29'][i%4]}`;e.innerHTML=`<div class="thought">${esc(a.current_task)}</div><div class="status">${ico[a.status]||'·'}</div><div class="avatar"><i class="head"></i><i class="hair"></i><i class="bodyp"></i><i class="legs"></i></div><div class="tag">${esc(a.name)}</div>`;l.appendChild(e)})}function render(){renderAgents();$('ac').textContent=D.agents.length;$('active').textContent=D.agents.filter(a=>a.status==='WORKING').length;$('ap').textContent=D.approvals||0;$('q').textContent=D.queue||0;$('activity').innerHTML=D.events.map(e=>card(e.agent_id||e.event_type,e.event_type,e.message,time(e.created_at))).join('')||card('활동 없음','','새 이벤트가 기록되면 표시됩니다.','');const open=D.jobs.filter(j=>!['COMPLETED','BLOCKED','FAILED','CANCELLED','WAITING_APPROVAL'].includes(j.status));$('jobs').innerHTML=open.map(j=>card(j.owner_agent_id,j.status,j.title,capName(j.capability_key)+' · '+time(j.created_at),j.id)).join('')||card('업무 없음','','등록된 일반 업무가 없습니다.','');$('templates').innerHTML=D.templates.map(t=>`<article class="card click" data-template="${esc(t.template_key)}"><span class="badge">${esc(t.category)}</span><h4>${esc(t.name)}</h4><p>${esc(t.description)}</p><small>${esc(t.agent_id)} · ${esc(capName(t.capability_key))}</small></article>`).join('')||card('템플릿 없음','','활성 템플릿이 없습니다.','');$('context').innerHTML=D.contexts.map(c=>card(c.context_key,'P'+c.priority,(c.source_files||[]).join(' · '),c.category+' · '+c.version)).join('')||card('컨텍스트 없음','','활성 PMO 컨텍스트가 없습니다.','');const ex=D.execution||{},u=D.usage_summary||{},b=D.budget_policy||{};$('governance').innerHTML=`<div class="card"><h4>MODEL EXECUTION</h4><p>${esc(ex.model_provider||'NONE')} · ${esc(ex.model_name||'UNSET')} · ${ex.model_enabled?'ENABLED':'BLOCKED'}</p><small>${esc(ex.disabled_reason||'')}</small></div><div class="card"><h4>USAGE / BUDGET</h4><p>오늘 토큰 ${Number(u.daily?.total_tokens||0).toLocaleString('ko-KR')} · 오늘 비용 ${Number(u.daily?.estimated_cost_thb||0).toLocaleString('ko-KR')} THB</p><small>Hard Stop ${b.hard_stop?'ACTIVE':'OFF'} · Tool Policy ${(D.tool_policies||[]).length}</small></div>`+(D.tool_policies||[]).map(p=>card(p.name,p.enabled?'ENABLED':'DISABLED',p.tool_key+' · '+p.access_mode,p.requires_approval?'승인 필요':'자동 허용')).join('');$('results').innerHTML=D.jobs.filter(j=>['COMPLETED','BLOCKED','FAILED','CANCELLED'].includes(j.status)).map(j=>card(j.owner_agent_id,j.status,j.title,capName(j.capability_key)+' · '+time(j.created_at),j.id)).join('')||card('결과 없음','','완료 또는 차단된 업무가 없습니다.','');$('approval').innerHTML=D.jobs.filter(j=>j.status==='WAITING_APPROVAL').map(j=>card(j.owner_agent_id,j.status,j.title,time(j.created_at),j.id)).join('')||card('승인 대기 없음','','위험 업무는 이 탭에 보류됩니다.','');document.querySelectorAll('[data-template]').forEach(e=>e.onclick=()=>selectTemplate(e.dataset.template));document.querySelectorAll('[data-job]').forEach(e=>e.onclick=()=>openJob(e.dataset.job));const w=!!D.settings?.workday_enabled;$('workday').textContent=w?'● 24H SCHEDULER ACTIVE':'○ SCHEDULER PAUSED';$('workday').classList.toggle('on',w);$('model').textContent=ex.model_enabled?`MODEL: ${ex.model_provider}/${ex.model_name}`:`MODEL: BLOCKED/${ex.disabled_reason||'NOT CONFIGURED'}`}async function load(){try{D=await api('/state');$('runtime').textContent=`${D.runtime} · Capability ${D.capabilities?.length||0} · Tool Policy ${D.tool_policies?.length||0}`;render()}catch(e){$('runtime').textContent='API 오류 · '+e.message}}function selectTemplate(k){const t=D.templates.find(x=>x.template_key===k);if(!t)return;sel=k;$('input').value=t.command_template;$('selectedName').textContent=`TEMPLATE: ${t.name} · ${capName(t.capability_key)}`;$('selected').classList.add('on');$('cs').textContent='TEMPLATE → '+t.name}async function dispatch(){const command=$('input').value.trim();if(!command&&!sel)return;$('send').disabled=true;$('cs').textContent='DISPATCHING';try{const d=await api('/command',{method:'POST',body:JSON.stringify({command,template_key:sel||undefined})});$('input').value='';sel=null;$('selected').classList.remove('on');$('cs').textContent=`${d.job.status} → ${d.job.owner_agent_id}`;await load()}catch(e){$('cs').textContent='ERROR: '+e.message}finally{$('send').disabled=false}}function openJob(id){job=D.jobs.find(x=>x.id===id);if(!job)return;$('jobTitle').textContent=job.title;$('jobMeta').textContent=`${job.status} · ${job.owner_agent_id||'pmo'} · ${capName(job.capability_key)} · ${job.risk_level}`;$('jobResult').textContent=job.result?.output_text||job.result?.reason||job.error_message||JSON.stringify(job.result||{},null,2)||'아직 결과가 없습니다.';const a=[];if(job.status==='WAITING_APPROVAL')a.push('<button data-a="reject">거부</button><button class="approve" data-a="approve">승인</button>');else if(['BLOCKED','FAILED','CANCELLED'].includes(job.status))a.push('<button data-a="retry">재시도</button>');$('jobActions').innerHTML=a.join('');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>jobAction(b.dataset.a));$('jobModal').hidden=false}async function jobAction(a){try{await api('/'+a,{method:'POST',body:JSON.stringify({job_id:job.id})});$('jobModal').hidden=true;await load()}catch(e){alert('업무 처리 실패: '+e.message)}}$('refresh').onclick=load;$('send').onclick=dispatch;$('clearTemplate').onclick=()=>{sel=null;$('selected').classList.remove('on');$('input').value='';$('cs').textContent='READY'};$('workday').onclick=async()=>{try{await api('/admin/workday',{method:'POST',body:JSON.stringify({enabled:!D.settings?.workday_enabled})});await load()}catch(e){alert(e.message)}};$('closeModal').onclick=()=>{$('jobModal').hidden=true};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});setInterval(()=>$('clock').textContent=new Date().toLocaleString('ko-KR',{timeZone:'Asia/Bangkok',hour12:false}),1000);load();setInterval(load,15000);
</script></body></html>
