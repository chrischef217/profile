<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unity Global AI Office</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#040608;color:#e7edf3;font:13px system-ui}button,input{font:inherit}.locked #gate{display:grid}#gate{display:none;position:fixed;inset:0;z-index:99;place-items:center;background:#030507f5}.login{width:min(380px,90vw);padding:28px;border:1px solid #00ff4160;border-radius:16px;background:#0b1117}.login input,.login button{width:100%;height:42px;margin-top:9px;border-radius:8px}.login input{background:#020405;border:1px solid #00ff4160;color:#fff;padding:0 12px}.login button,.send{border:0;background:#00ff41;color:#001706;font-weight:900}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ffffff18}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#00ff41;color:#001706;font-weight:1000}.brand small{display:block;color:#82909e}.stats{display:flex;gap:8px}.stat{padding:7px 10px;border:1px solid #00ff4130;border-radius:9px}.stat b{color:#00ff41;margin-left:8px}.bar{height:28px;padding:6px 18px;color:#82909e;border-bottom:1px solid #ffffff18}.app{height:calc(100% - 98px);display:grid;grid-template-columns:1fr 390px}.office{display:flex;flex-direction:column;border-right:1px solid #ffffff18}.scene{flex:1;display:grid;place-items:center;overflow:hidden}.world{height:96%;aspect-ratio:512/544;position:relative;background:#111;border:1px solid #00ff4150;border-radius:8px;overflow:hidden}.world>img{width:100%;height:100%;image-rendering:pixelated}.agent{position:absolute;transform:translate(-50%,-50%);padding:3px 5px;border:1px solid var(--c);border-radius:6px;background:#03070ae8;font-size:9px;box-shadow:0 0 10px var(--c)}.agent i{display:block;text-align:center;font-size:18px;font-style:normal I WEB PORT · CONTROL STAGE 6</small></div></div><div class="stats"><div class="stat">AGENTS <b id="agents">0</b></div><div class="stat">ACTIVE <b id="active">0</b></div><div class="stat">APPROVAL <b id="approvals">0</b></div><div class="stat">QUEUE <b id="queue">0</b></div></div><div><button id="scheduler">24H</button> <button id="logout">LOGOUT</button></div></header><div class="bar"><span id="runtime">관리자 인증 대기</span> · <span id="model">MODEL CHECKING</span> · <span id="clock"></span></div><main class="app"><section class="office"><div class="scene"><div class="world"><img src="https://raw.githubusercontent.com/wonseokjung/connect-ai/main/assets/pixel/office/Office_Design_2.gif"><div id="people"></div></div></div><div class="dock"><div class="cmd"><input id="command" disabled placeholder="업무를 지시하거나 템플릿을 선택하십시오"><button id="send" class="send" disabled>업무 배정</button></div></div></section><aside class="side"><nav class="tabs"><button class="tab on" data-p="activity">ACTIVITY</button><button class="tab" data-p="jobs">JOBS</button><button class="tab" data-p="templates">TEMPLATES</button><button class="tab" data-p="context">CONTEXT</button><button class="tab" data-p="governance">GOVERNANCE</button><button class="tab" data-p="results">RESULTS</button><button class="tab" data-p="approval">APPROVAL</button></nav><div id="activity" class="panel on"></div><div id="jobs" class="panel"></div><div id="templates" class="panel"></div><div id="context" class="panel"></div><div id="governance" class="panel"></div><div id="results" class="panel"></div><div id="approval" class="panel"></div><div class="note">Capability Composition · Context Selection · Tool Policy · Budget Hard Stop · 1-minute Runner</div></aside></main><div id="modal" class="modal" hidden><div class="box"><button id="close">닫기</button><h2 id="mt"></h2><p id="mm"></p><pre id="mr"></pre><div id="ma" class="actions"></div></div></div><script>const API='https://ckzwmimmwdnmpohgvcka.supabase.co/functions/v1/unity-ai-office-web',P={pmo:[88,88],design:[64,38],dev:[28,58],sales:[28,38],product:[46,38],marketing:[82,38],finance:[82,58],admin:[70,78],research:[50,78],audit:[18,78]},C={pmo:'#00ff41',design:'#a78bfa',dev:'#22d3ee',sales:'#ff7a59',product:'#38bdf8',marketing:'#e1306c',finance:'#fbbf24',admin:'#84cc16',research:'#60a5fa',audit:'#fb7185'};let D={agents:[],jobs:[],events:[],templates:[],contexts:[],capabilities:[],tool_policies:[]},T=null,J=null;const $=x=>document.getElementById(x),token=()=>sessionStorage.getItem('ug_ai_office_token')||'',e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){let h=new Headers(o.headers||{});if(token())h.set('authorization','Bearer '+token());if(o.body)h.set('content-type','application/json');let r=await fetch(API+p,{...o,headers:h,cache:'no-store'}),d=await r.json().catch(()=>({error:'HTTP_'+r.status}));if(r.status===401&&p!='/admin/login'){lock();throw Error('SESSION_EXPIRED')}if(!r.ok||d.ok===false)throw Error(d.error||'HTTP_'+r.status);return d}function lock(){sessionStorage.clear();document.body.classList.add('locked');$('command').disabled=$('send').disabled=true}function unlock(){document.body.classList.remove('locked');$('command').disabled=$('send').disabled=false}function card(t,s,p,m,id='',tk=''){return `<article class="card" ${id?`data-j="${id}"`:''} ${tk?`data-t="${tk}"`:''}><span class="badge ${e(s)}">${e(s)}</span><h4>${e(t)}</h4><p>${e(p)}</p><small>${e(m)}</small></article>`}function cap(k){return D.capabilities.find(x=>x.capability_key===k)?.name||k||'—'}function render(){let pe=$('people');pe.innerHTML='';D.agents.forEach(a=>{let p=P[a.id]||[50,50],x=document.createElement('div');x.className='agent';x.style.cssText=`left:${p[0]}%;top:${p[1]}%;--c:${C[a.id]||'#00ff41'}`;x.innerHTML=`<i>${a.emoji||'🤖'}</i>${e(a.name)}<br>${e(a.status)}`;pe.appendChild(x)});$('agents').textContent=D.agents.length;$('active').textContent=D.agents.filter(x=>x.status==='WORKING').length;$('approvals').textContent=D.approvals||0;$('queue').textContent=D.queue||0;$('activity').innerHTML=D.events.map(x=>card(x.agent_id||x.event_type,x.event_type,x.message,new Date(x.created_at).toLocaleTimeString('ko-KR'))).join('')||card('활동 없음','','새 이벤트가 기록되면 표시됩니다.','');$('jobs').innerHTML=D.jobs.filter(x=>!['COMPLETED','BLOCKED','FAILED','CANCELLED','WAITING_APPROVAL'].includes(x.status)).map(x=>card(x.owner_agent_id,x.status,x.title,cap(x.capability_key),x.id)).join('')||card('업무 없음','','등록된 업무가 없습니다.','');$('templates').innerHTML=D.templates.map(x=>card(x.name,x.category,x.description,cap(x.capability_key),'',x.template_key)).join('')||card('템플릿 없음','','활성 템플릿이 없습니다.','');$('context').innerHTML=D.contexts.map(x=>card(x.context_key,'P'+x.priority,(x.source_files||[]).join(' · '),x.category)).join('')||card('컨텍스트 없음','','활성 컨텍스트가 없습니다.','');let ex=D.execution||{},u=D.usage_summary||{};$('governance').innerHTML=card('MODEL EXECUTION',ex.model_enabled?'ENABLED':'BLOCKED',(ex.model_provider||'NONE')+' · '+(ex.model_name||'UNSET'),ex.disabled_reason||'')+card('USAGE / BUDGET','HARD STOP',`오늘 토큰 ${u.daily?.total_tokens||0} · 비용 ${u.daily?.estimated_cost_thb||0} THB`,`Tool Policy ${(D.tool_policies||[]).length}`)+(D.tool_policies||[]).map(x=>card(x.name,x.enabled?'ENABLED':'DISABLED',x.tool_key+' · '+x.access_mode,x.requires_approval?'승인 필요':'자동 허용')).join('');$('results').innerHTML=D.jobs.filter(x=>['COMPLETED','BLOCKED','FAILED','CANCELLED'].includes(x.status)).map(x=>card(x.owner_agent_id,x.status,x.title,cap(x.capability_key),x.id)).join('')||card('결과 없음','','완료 또는 차단 결과가 없습니다.','');$('approval').innerHTML=D.jobs.filter(x=>x.status==='WAITING_APPROVAL').map(x=>card(x.owner_agent_id,x.status,x.title,cap(x.capability_key),x.id)).join('')||card('승인 대기 없음','','위험 업무가 없습니다.','');document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{let t=D.templates.find(y=>y.template_key===x.dataset.t);T=t.template_key;$('command').value=t.command_template});document.querySelectorAll('[data-j]').forEach(x=>x.onclick=()=>openJob(x.dataset.j));$('model').textContent=ex.model_enabled?`MODEL ${ex.model_provider}/${ex.model_name}`:`MODEL BLOCKED/${ex.disabled_reason||'NOT CONFIGURED'}`;$('scheduler').textContent=D.settings?.workday_enabled?'● 24H ACTIVE':'○ PAUSED'}async function load(){D=await api('/state');$('runtime').textContent=`${D.runtime} · Capability ${D.capabilities?.length||0} · Context ${D.contexts?.length||0}`;render()}function openJob(id){J=D.jobs.find(x=>x.id===id);$('mt').textContent=J.title;$('mm').textContent=`${J.status} · ${J.owner_agent_id||'pmo'} · ${cap(J.capability_key)} · ${J.risk_level}`;$('mr').textContent=J.result?.output_text||J.result?.reason||J.error_message||JSON.stringify(J.result||{},null,2);let a=[];if(J.status==='WAITING_APPROVAL')a=['reject','approve'];else if(['BLOCKED','FAILED','CANCELLED'].includes(J.status))a=['retry'];$('ma').innerHTML=a.map(x=>`<button data-a="${x}">${x}</button>`).join('');document.querySelectorAll('[data-a]').forEach(x=>x.onclick=async()=>{await api('/'+x.dataset.a,{method:'POST',body:JSON.stringify({job_id:J.id})});$('modal').hidden=true;load()});$('modal').hidden=false}$('login').onsubmit=async ev=>{ev.preventDefault();try{let d=await api('/admin/login',{method:'POST',body:JSON.stringify({passcode:$('code').value.trim()})});sessionStorage.setItem('ug_ai_office_token',d.token);unlock();await load()}catch(x){$('err').textContent=x.message}};$('logout').onclick=()=>lock();$('send').onclick=async()=>{let command=$('command').value.trim();if(!command&&!T)return;await api('/command',{method:'POST',body:JSON.stringify({command,template_key:T||undefined})});$('command').value='';T=null;load()};$('scheduler').onclick=async()=>{await api('/admin/workday',{method:'POST',body:JSON.stringify({enabled:!D.settings?.workday_enabled})});load()};$('close').onclick=()=>$('modal').hidden=true;document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(y=>y.classList.remove('on'));x.classList.add('on');$(x.dataset.p).classList.add('on')});setInterval(()=>$('clock').textContent=new Date().toLocaleString('ko-KR',{timeZone:'Asia/Bangkok',hour12:false}),1000);(async()=>{if(!token())return lock();try{await api('/admin/session');unlock();load()}catch{lock()}})();setInterval(()=>{if(!document.body.classList.contains('locked'))load()},15000);</script></body></html>
