<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Unity Global AI Office</title><style>:root{--g:#00ff41;--bg:#040608;--line:rgba(255,255,255,.09);--text:#e7edf3;--dim:#82909e;--warn:#ffb020}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}body{display:flex;flex-direction:column;background:radial-gradient(circle at 50% -20%,rgba(0,255,65,.09),transparent 45%),#040608}.top{height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(5,8,11,.96);position:relative;z-index:20}.top:after{content:'';position:absolute;left:8%;right:8%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--g),transparent)}.brand{display:flex;align-items:center;gap:11px}.logo{width:41px;height:41px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#9affab,var(--g) 55%,#008f11);color:#001908;font-weight:1000;box-shadow:0 0 22px rgba(0,255,65,.32)}.brand b{display:block;font-size:14px;letter-spacing:.08em}.brand small{display:block;color:var(--dim);font-size:8px;letter-spacing:.14em;margin-top:3px}.hud{display:flex;gap:7px}.stat{min-width:80px;padding:7px 10px;border:1px solid rgba(0,255,65,.18);border-radius:9px;background:rgba(0,255,65,.04);display:flex;justify-content:space-between;gap:8px}.stat span{font-size:7px;color:var(--dim);letter-spacing:.12em}.stat strong{color:var(--g);font-family:monospace}.stat.warn strong{color:var(--warn)}.actions{display:flex;justify-content:flex-end;gap:7px}.actions button{height:35px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.04);color:var(--text);font-size:9px;font-weight:800;padding:0 10px;cursor:pointer}.actions .on{border-color:var(--g);color:var(--g);background:rgba(0,255,65,.1);box-shadow:0 0 15px rgba(0,255,65,.16)}.bar{height:29px;padding:0 18px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);font-size:9px;color:var(--dim)}.dot{width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);animation:blink 1.3s infinite}@keyframes blink{50%{opacity:.25}}.shell{flex:1;min-height:0;display:grid;grid-template-columns:1fr 330px}.office{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#070a0f}.frame{flex:1;min-height:0;display:grid;place-items:center;padding:13px}.stage{height:100%;max-width:100%;aspect-ratio:512/544;position:relative;overflow:hidden;border-radius:7px;background:#10151a;box-shadow:0 0 0 1px rgba(0,255,65,.25),0 22px 70px #000,0 0 45px rgba(0,255,65,.08)}.bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.stage:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse,transparent 55%,rgba(0,0,0,.52)),repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.08) 3px 4px);pointer-events:none;z-index:6}.layer{position:absolute;inset:0;z-index:10}.agent{position:absolute;transform:translate(-50%,-82%);width:52px;height:68px;cursor:pointer}.avatar{width:32px;height:42px;margin:auto;position:relative;filter:drop-shadow(0 5px 4px #000)}.head{position:absolute;left:8px;top:0;width:16px;height:15px;border-radius:5px;background:var(--skin)}.hair{position:absolute;left:7px;top:-2px;width:18px;height:8px;border-radius:6px 6px 2px 2px;background:var(--hair)}.body{position:absolute;left:5px;top:14px;width:22px;height:21px;border-radius:5px;background:var(--c);box-shadow:inset 0 -5px rgba(0,0,0,.2)}.legs{position:absolute;left:8px;top:34px;width:16px;height:8px;border-left:6px solid #18202b;border-right:6px solid #18202b}.tag{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);white-space:nowrap;padding:2px 5px;border-radius:4px;background:rgba(3,7,10,.92);border:1px solid var(--c);font-size:7px;font-weight:900}.status{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:#03070a;border:1px solid var(--c);box-shadow:0 0 10px var(--c);font-size:10px}.agent.WORKING .avatar{animation:work .7s ease-in-out infinite alternate}.agent.WAITING_APPROVAL .status{animation:warn .8s infinite}@keyframes work{to{transform:translateY(-2px)}}@keyframes warn{50%{transform:translateX(-50%) scale(1.25)}}.thought{position:absolute;left:50%;bottom:calc(100% + 16px);transform:translateX(-50%);opacity:0;transition:.2s;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(3,8,11,.95);border:1px dashed var(--c);border-radius:10px;padding:5px 8px;font-size:8px}.agent:hover .thought{opacity:1}.dock{height:90px;padding:10px 14px;border-top:1px solid var(--line);background:#05070a}.dockhead{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.12em;color:var(--dim);margin-bottom:7px}.dockhead b{color:var(--g)}.cmd{display:grid;grid-template-columns:1fr 100px;gap:7px}.cmd input{height:39px;border:1px solid rgba(0,255,65,.25);border-radius:8px;background:#020405;color:#fff;padding:0 12px;outline:none}.cmd button{border:0;border-radius:8px;background:linear-gradient(135deg,#79ff8d,var(--g),#008f11);color:#001706;font-weight:1000;cursor:pointer}.side{min-height:0;display:flex;flex-direction:column;background:#06090d}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.tab{height:41px;border:0;background:transparent;color:var(--dim);font-size:8px;font-weight:900;letter-spacing:.1em;cursor:pointer}.tab.active{color:var(--g);background:rgba(0,255,65,.06);box-shadow:inset 0 -2px var(--g)}.panel{display:none;flex:1;overflow:auto;padding:9px}.panel.active{display:block}.card{padding:9px;margin-bottom:7px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.025)}.card h4{margin:0;font-size:10px}.card p{margin:5px 0;color:#a9b4bf;font-size:9px;line-height:1.45}.card small{color:var(--dim);font-size:7px}.badge{float:right;padding:2px 4px;border-radius:4px;border:1px solid rgba(0,255,65,.25);color:var(--g);font-size:6px}.badge.WAITING_APPROVAL{color:var(--warn);border-color:var(--warn)}.note{padding:10px;border-top:1px solid var(--line);color:var(--dim);font-size:8px;line-height:1.4}.note b{color:var(--g)}@media(max-width:850px){.top{grid-template-columns:1fr auto}.hud{display:none}.shell{grid-template-columns:1fr 280px}}@media(max-width:650px){html,body{overflow:auto}.top{height:64px;padding:8px}.brand small,.actions button:last-child{display:none}.shell{display:block}.office{height:calc(100vh - 93px)}.side{height:500px}.stage{width:min(96%,512px);height:auto}.actions button{font-size:7px}}</style></head><body><header class="top"><div class="brand"><div class="logo">UG</div><div><b>UNITY GLOBAL AI OFFICE</b><small>CONNECT-AI WEB PORT · ONLINE 24/7</small></div></div><div class="hud"><div class="stat"><span>AGENTS</span><strong id="ac">10</strong></div><div class="stat"><span>ACTIVE</span><strong id="active">0</strong></div><div class="stat warn"><span>APPROVAL</span><strong id="ap">0</strong></div><div class="stat"><span>QUEUE</span><strong id="q">0</strong></div></div><div class="actions"><button id="work" class="on">● 24H WORKDAY ON</button><button id="refresh">↻ REFRESH</button></div></header><div class="bar"><i class="dot"></i><span id="runtime">온라인 런타임 연결 중</span><span>|</span><span id="clock"></span></div><main class="shell"><section class="office"><div class="frame"><div class="stage"><img class="bg" src="https://raw.githubusercontent.com/wonseokjung/connect-ai/main/assets/pixel/office/Office_Design_2.gif" alt="Connect AI office"><div id="layer" class="layer"></div></div></div><div class="dock"><div class="dockhead"><span>⌘ MANAGING DIRECTOR COMMAND</span><b id="cs">READY</b></div><div class="cmd"><input id="input" placeholder="AI Office에 업무를 지시하십시오"><button id="send">업무 배정</button></div></div></section><aside class="side"><div class="tabs"><button class="tab active" data-id="activity">ACTIVITY</button><button class="tab" data-id="queue">QUEUE</button><button class="tab" data-id="approval">APPROVAL</button></div><div id="activity" class="panel active"></div><div id="queue" class="panel"></div><div id="approval" class="panel"></div><div class="note"><b>ORIGINAL OFFICE PORT</b><br>원본 오피스 배치와 상태 표시 개념을 온라인 웹 런타임으로 이식했습니다.</div></aside></main><script>const API='https://ckzwmimmwdnmpohgvcka.supabase.co/functions/v1/unity-ai-office-web',pos={pmo:[88,88],design:[64,38],dev:[28,58],sales:[28,38],product:[46,38],marketing:[82,38],finance:[82,58],admin:[70,78],research:[50,78],audit:[18,78]},col={pmo:'#00ff41',design:'#a78bfa',dev:'#22d3ee',sales:'#ff7a59',product:'#38bdf8',marketing:'#e1306c',finance:'#fbbf24',admin:'#84cc16',research:'#60a5fa',audit:'#fb7185'},icons={WORKING:'⚙',IDLE:'·',WAITING_APPROVAL:'!',DONE:'✓',REVIEWING:'⌕'};let data={agents:[],queue:0,approvals:0},events=[];const $=x=>document.getElementById(x),esc=s=>String(s).replace(/[&<>']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;'}[c]));function card(a){return '<article class="card"><span class="badge '+a.status+'">'+a.status+'</span><h4>'+esc(a.name)+'</h4><p>'+esc(a.task)+'</p><small>'+new Date(a.time).toLocaleTimeString('ko-KR')+'</small></article>'}function render(){let l=$('layer');l.innerHTML='';data.agents.forEach((a,i)=>{let p=pos[a.id]||[50,50],e=document.createElement('div');e.className='agent '+a.status;e.style.cssText='left:'+p[0]+'%;top:'+p[1]+'%;--c:'+(col[a.id]||'#00ff41')+';--skin:'+['#d9a679','#f0c7a5','#a86f4b','#e0ad85'][i%4]+';--hair:'+['#17202b','#4b2e20','#1f2937','#5b3a29'][i%4];e.innerHTML='<div class="thought">'+esc(a.task)+'</div><div class="status">'+(icons[a.status]||'·')+'</div><div class="avatar"><i class="head"></i><i class="hair"></i><i class="body"></i><i class="legs"></i></div><div class="tag">'+esc(a.name)+'</div>';l.appendChild(e)});$('ac').textContent=data.agents.length;$('active').textContent=data.agents.filter(a=>['WORKING','REVIEWING'].includes(a.status)).length;$('ap').textContent=data.approvals;$('q').textContent=data.queue;let live=data.agents.filter(a=>a.status!=='IDLE').map(a=>({name:a.name,task:a.task,status:a.status,time:a.updatedAt}));$('activity').innerHTML=events.concat(live).slice(0,20).map(card).join('');$('queue').innerHTML=data.agents.filter(a=>!['IDLE','DONE'].includes(a.status)).map(a=>card({name:a.name,task:a.task,status:a.status,time:a.updatedAt})).join('')||'<div class="card">대기열 없음</div>';$('approval').innerHTML=data.agents.filter(a=>a.status==='WAITING_APPROVAL').map(a=>card({name:a.name,task:a.task,status:a.status,time:a.updatedAt})).join('')||'<div class="card"><h4>승인 대기 없음</h4><p>위험 작업이 접수되면 표시됩니다.</p></div>'}async function load(){try{let r=await fetch(API+'/state',{cache:'no-store'});if(!r.ok)throw 0;data=await r.json();$('runtime').textContent=data.runtime+' · '+data.mode;render()}catch{$('runtime').textContent='API 연결 오류'}}async function send(){let command=$('input').value.trim();if(!command)return;$('cs').textContent='DISPATCHING';try{let r=await fetch(API+'/command',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({command})}),j=(await r.json()).job;events.unshift({name:'MD COMMAND',task:j.title+' → '+j.owner,status:j.status,time:j.createdAt});let a=data.agents.find(x=>x.id===j.owner);if(a){a.status=j.status;a.task=j.title;a.updatedAt=j.createdAt}data.queue++;if(j.status==='WAITING_APPROVAL')data.approvals++;$('input').value='';$('cs').textContent=j.status;render()}catch{$('cs').textContent='ERROR'}}$('send').onclick=send;$('input').onkeydown=e=>e.key==='Enter'&&send();$('refresh').onclick=load;$('work').onclick=e=>{let on=e.currentTarget.classList.toggle('on');e.currentTarget.textContent=on?'● 24H WORKDAY ON':'○ 24H WORKDAY OFF'};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.id).classList.add('active')});setInterval(()=>$('clock').textContent=new Date().toLocaleString('ko-KR',{timeZone:'Asia/Bangkok',hour12:false}),1000);load();setInterval(load,60000)</script></body></html>
