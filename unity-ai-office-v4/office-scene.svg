  .label{fill:#10161d;stroke:#a47a39;stroke-width:2} .label-text{fill:#f1e4cf;font:700 18px ui-monospace,monospace;letter-spacing:1px}
  .desk path{fill:#6b4f3a;stroke:#1d1712;stroke-width:3} .monitor{fill:#102631;stroke:#8aa0aa;stroke-width:2;animation:screen 2.4s steps(2,end) infinite} .screen-line{fill:#47b7d6;opacity:.7} .screen-line.alt{fill:#e3a14b}
  .chair{fill:#202a31;stroke:#05080a;stroke-width:2} .plant rect{fill:#69472d} .plant circle{fill:#557c3d;stroke:#24371f;stroke-width:2}
