<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Unity Global AI Office V4</title>
  <meta name="description" content="Unity Global AI Office 4:3 game operations dashboard">
  <link rel="stylesheet" href="../unity-ai-office-v2/styles.css">
  <link rel="stylesheet" href="./layout.css">
  <link rel="stylesheet" href="./agents.css">
  <link rel="stylesheet" href="./movement.css">
</head>
<body>
  <main id="appShell" class="app-shell" aria-label="Unity Global AI Office">
    <header class="top-header frame-panel">
      <div class="brand-block">
        <div class="brand-emblem" aria-hidden="true"><span>U</span><small>AI</small></div>
        <div class="brand-copy"><h1>UNITY GLOBAL AI OFFICE</h1><div class="runtime-line"><span id="dayCount">DAY —</span><span class="online-dot"></span><strong id="onlineText">ONLINE</strong><span class="separator">|</span><span id="clockText">--:--</span><span class="location-icon">☀</span><span>BANGKOK</span></div></div>
      </div>
      <div class="resource-bar"><div class="resource-item"><span class="resource-icon coin">฿</span><strong id="costValue">0</strong></div><div class="resource-item"><span class="resource-icon diamond">◇</span><strong id="approvalResource">0</strong></div><div class="resource-item"><span class="resource-icon energy">ϟ</span><strong id="energyValue">120/120</strong></div><button id="languageButton" class="icon-button" type="button">KO</button><button id="refreshButton" class="icon-button" type="button">↻</button></div>
    </header>

    <section class="main-grid">
      <section class="office-map-panel" aria-label="AI Office game map">
        <div class="map-stage" id="mapStage">
          <img class="office-map-image" src="./office-scene.svg" alt="Unity Global modern isometric AI office">
          <div class="map-tone"></div>
          <div id="agentLayer" class="agent-layer" aria-label="Independent AI agent characters"></div>
          <div id="departmentLayer" class="department-layer"></div>
          <div id="officeToast" class="office-toast" hidden></div>
        </div>
      </section>

      <aside class="right-rail">
        <section class="office-status frame-panel-inner"><h2><span>▥</span> <span data-i18n="status.title">OFFICE STATUS</span></h2><dl><div><dt data-i18n="status.agents">AGENTS</dt><dd id="agentsCount">0</dd></div><div><dt data-i18n="status.active">ACTIVE</dt><dd id="activeCount" class="value-active">0</dd></div><div><dt data-i18n="status.queue">QUEUE</dt><dd id="queueCount" class="value-queue">0</dd></div><div><dt data-i18n="status.approval">APPROVAL</dt><dd id="approvalCount" class="value-approval">0</dd></div></dl></section>
        <section class="work-panel frame-panel-inner"><nav class="work-tabs"><button class="work-tab active" data-tab="jobs" data-i18n="tabs.jobs">JOBS</button><button class="work-tab" data-tab="results" data-i18n="tabs.results">RESULTS</button><button class="work-tab" data-tab="approval" data-i18n="tabs.approval">APPROVAL</button><button class="work-tab" data-tab="system" data-i18n="tabs.system">SYSTEM</button></nav><div id="tabContent" class="tab-content"></div></section>
        <section class="list-panel queue-panel frame-panel-inner"><header><h3 data-i18n="queue.title">QUEUE</h3><strong id="queueTotal">0</strong></header><div id="queueList" class="compact-list"></div></section>
        <section class="list-panel approval-panel frame-panel-inner"><header><h3 data-i18n="approval.title">APPROVAL</h3><strong id="approvalTotal">0</strong></header><div id="approvalList" class="compact-list"></div></section>
        <section class="command-center frame-panel-inner"><h3 data-i18n="command.title">COMMAND CENTER</h3><form id="commandForm"><select id="templateSelect" aria-label="Task template"><option value="">직접 지시 / 업무 템플릿 선택</option></select><input id="commandInput" autocomplete="off" data-i18n-placeholder="command.placeholder" placeholder="지시를 입력하세요..."><button id="executeButton" type="submit"><span data-i18n="command.execute">실행</span><b>▶</b></button></form><p id="commandFeedback" aria-live="polite"></p></section>
      </aside>
    </section>

    <footer class="bottom-bar frame-panel"><nav class="bottom-nav"><button class="nav-item active" data-view="dashboard"><span>▥</span><b data-i18n="nav.dashboard">DASHBOARD</b></button><button class="nav-item" data-view="projects"><span>☷</span><b data-i18n="nav.projects">PROJECTS</b></button><button class="nav-item" data-view="agents"><span>♟</span><b data-i18n="nav.agents">AGENTS</b></button><button class="nav-item" data-view="analytics"><span>▥</span><b data-i18n="nav.analytics">ANALYTICS</b></button><button class="nav-item" data-view="knowledge"><span>▤</span><b data-i18n="nav.knowledge">KNOWLEDGE</b></button><button class="nav-item" data-view="resources"><span>▱</span><b data-i18n="nav.resources">RESOURCES</b></button><button class="nav-item" data-view="reports"><span>▧</span><b data-i18n="nav.reports">REPORTS</b></button><button class="nav-item" data-view="settings"><span>⚙</span><b data-i18n="nav.settings">SETTINGS</b></button></nav><div class="health-box"><div><span data-i18n="health.title">SYSTEM HEALTH</span><strong id="healthScore">—</strong></div><div class="health-track"><i id="healthBar"></i></div><span class="health-shield">◇</span></div></footer>
  </main>

  <dialog id="sectionDialog" class="section-dialog"><form method="dialog" class="dialog-card frame-panel"><button class="dialog-close" value="cancel">×</button><h2 id="dialogTitle"></h2><div id="dialogContent" class="dialog-content"></div></form></dialog>

  <script src="../unity-ai-office-v2/app-a.js"></script><script>document.querySelector('.office-map-image').src='./office-scene.svg';</script><script src="../unity-ai-office-v2/app-b.js"></script><script src="../unity-ai-office-v2/app-c.js"></script>
  <script src="./agent-engine.js"></script><script src="./agent-runtime-map.js"></script><script src="./movement.js"></script>
</body>
</html>
