name: AI Office Stage 11 Live QA

on:
  push:
    branches: [main]
    paths:
      - 'unity-ai-office-stage11/**'
      - 'unity-ai-office-v5/**'
      - '.github/workflows/ai-office-stage11-live-qa.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public API and frozen Game V5
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error

          api = 'https://ckzwmimmwdnmpohgvcka.supabase.co/functions/v1/unity-ai-office-prod'
          sha = os.environ['COMMIT_SHA']
          game = f'https://raw.githack.com/chrischef217/profile/{sha}/unity-ai-office-v5/index.html'
          payload = f'https://raw.githack.com/chrischef217/profile/{sha}/unity-ai-office-v5/payload-a.js'

          def get(url, attempts=6):
              last = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent':'UnityGlobal-Stage11-GitHub-Actions',
                          'Accept':'application/json,text/html,application/javascript,*/*'
                      })
                      with urllib.request.urlopen(req, timeout=30) as response:
                          body = response.read().decode('utf-8', errors='replace')
                          return response.status, response.headers.get('content-type',''), body
                  except Exception as exc:
                      last = exc
                      time.sleep(5 + attempt * 2)
              raise RuntimeError(f'GET failed: {url}: {last}')

          health_status, health_type, health_text = get(api + '/health')
          assert health_status == 200, (health_status, health_text[:500])
          health = json.loads(health_text)
          assert health.get('ok') is True, health

          state_status, state_type, state_text = get(api + '/state')
          assert state_status == 200, (state_status, state_text[:500])
          state = json.loads(state_text)
          assert state.get('ok') is True, state
          assert state.get('mode') == 'ONLINE_MULTI_AGENT_STAGE_11_HARDENED', state.get('mode')
          assert state.get('document_integrity',{}).get('status') == 'PASS', state.get('document_integrity')
          hardening = state.get('api_hardening',{})
          assert hardening.get('rate_limit') is True, hardening
          assert hardening.get('command_idempotency') is True, hardening
          assert hardening.get('job_transition_audit') is True, hardening
          assert hardening.get('dependency_failure_propagation') is True, hardening

          pre_status, pre_type, pre_text = get(api + '/admin/preflight')
          assert pre_status == 200, (pre_status, pre_text[:500])
          pre = json.loads(pre_text)
          assert pre.get('stage') == 'ONLINE_MULTI_AGENT_STAGE_11_HARDENED', pre.get('stage')
          gates = pre.get('gates',{})
          assert gates.get('document_integrity_pass') is True, gates
          assert gates.get('api_rate_limit') is True, gates
          assert gates.get('command_idempotency') is True, gates
          assert gates.get('job_transition_audit') is True, gates
          assert gates.get('dependency_failure_propagation') is True, gates

          game_status, game_type, game_text = get(game)
          assert game_status == 200, (game_status, game_text[:500])
          assert 'text/html' in game_type, game_type
          assert 'UNITY GLOBAL AI OFFICE' in game_text
          assert 'GAME V5' in game_text
          assert 'ONLINE_MULTI_AGENT_STAGE_10_DOCUMENT_GROUNDED' in game_text

          payload_status, payload_type, payload_text = get(payload)
          assert payload_status == 200, payload_status
          assert 'javascript' in payload_type, payload_type
          assert '__UG_V5_PAYLOAD' in payload_text

          print(json.dumps({
              'status':'PASS',
              'api_health':health_status,
              'api_state':state_status,
              'api_preflight':pre_status,
              'document_integrity':state['document_integrity']['status'],
              'game_html':game_status,
              'game_payload':payload_status,
              'runtime':'ONLINE_MULTI_AGENT_STAGE_11_HARDENED'
          }, ensure_ascii=False, indent=2))
          PY
