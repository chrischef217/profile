name: Temporary Build Unity Drive Portal v2.6 Clean

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-build-v26-clean.yml'
      - 'v26-clean-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore validated source and patches
        run: |
          set -euo pipefail
          BASE_COMMIT=18fbb46ac7f956959ed0375f8b1236bf60bef4c7
          PATCH_COMMIT=fa2ec15d8e984f71627297256f2dfd105b25cf0a
          git archive "$BASE_COMMIT" temp-drive-portal-v23 | tar -x
          git show "$PATCH_COMMIT:temp-drive-portal-v23/patch_visual_tree.py" > temp-drive-portal-v23/patch_visual_tree.py
          git show "$PATCH_COMMIT:temp-drive-portal-v23/patch_google_motion_i18n.py" > temp-drive-portal-v23/patch_google_motion_i18n.py
          grep -q 'public class MainActivity extends Activity' temp-drive-portal-v23/app/src/main/java/com/unityglobal/unity_drive_access/MainActivity.java

      - name: Apply Google light bilingual motion redesign
        run: |
          set -euo pipefail
          APP_GRADLE=temp-drive-portal-v23/app/build.gradle
          python3 temp-drive-portal-v23/patch_visual_tree.py
          python3 temp-drive-portal-v23/patch_google_motion_i18n.py
          sed -i "s/versionCode 4/versionCode 7/" "$APP_GRADLE"
          sed -i "s/versionName '1.0.3'/versionName '1.0.6'/" "$APP_GRADLE"
          sed -i "/implementation 'androidx.core:core:1.15.0'/a\\    implementation 'com.google.mlkit:translate:17.0.3'" "$APP_GRADLE"
          cat >> "$APP_GRADLE" <<'EOF'

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
EOF

      - name: Validate requested implementation
        run: |
          set -euo pipefail
          MAIN=temp-drive-portal-v23/app/src/main/java/com/unityglobal/unity_drive_access/MainActivity.java
          APP_GRADLE=temp-drive-portal-v23/app/build.gradle
          grep -q 'private String language = "ko"' "$MAIN"
          grep -q 'loadSavedLanguage' "$MAIN"
          grep -q 'saveLanguage' "$MAIN"
          grep -q 'languageSelector' "$MAIN"
          grep -q 'ui_language' "$MAIN"
          grep -q 'TranslatorOptions' "$MAIN"
          grep -q 'TranslateLanguage.KOREAN' "$MAIN"
          grep -q 'TranslateLanguage.THAI' "$MAIN"
          grep -q 'UnityDriveTranslationCache' "$MAIN"
          grep -q 'startFloatingMotion' "$MAIN"
          grep -q 'animateCardIn' "$MAIN"
          grep -q 'buildMotionHero' "$MAIN"
          grep -q 'NAVY = Color.WHITE' "$MAIN"
          grep -q 'พอร์ทัลเอกสารบริษัท' "$MAIN"
          grep -q 'แผนผังโฟลเดอร์' "$MAIN"
          grep -q 'treeMiniNode' "$MAIN"
          ! grep -q 'VisualFolderTreeView mapView' "$MAIN"
          ! grep -q 'folderMap' "$MAIN"
          grep -q "implementation 'com.google.mlkit:translate:17.0.3'" "$APP_GRADLE"
          grep -q "kotlin-stdlib-jdk8" "$APP_GRADLE"
          grep -q "applicationId 'com.unityglobal.unity_drive_access'" "$APP_GRADLE"
          grep -q 'versionCode 7' "$APP_GRADLE"
          grep -q "versionName '1.0.6'" "$APP_GRADLE"
          grep -q 'android.permission.INTERNET' temp-drive-portal-v23/app/src/main/AndroidManifest.xml

      - name: Build unsigned release APK
        run: |
          set -euo pipefail
          gradle -p temp-drive-portal-v23 :app:assembleRelease --no-daemon --stacktrace
          mkdir -p output/signing-tools
          cp temp-drive-portal-v23/app/build/outputs/apk/release/app-release-unsigned.apk output/UnityGlobal-Drive-Portal-v2.6-unsigned.apk
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          cp "$BUILD_TOOLS_DIR/apksigner" output/signing-tools/
          cp "$BUILD_TOOLS_DIR/zipalign" output/signing-tools/
          cp "$BUILD_TOOLS_DIR/aapt" output/signing-tools/
          cp -R "$BUILD_TOOLS_DIR/lib" output/signing-tools/
          if [ -d "$BUILD_TOOLS_DIR/lib64" ]; then cp -R "$BUILD_TOOLS_DIR/lib64" output/signing-tools/; fi
          chmod +x output/signing-tools/apksigner output/signing-tools/zipalign output/signing-tools/aapt
          "$BUILD_TOOLS_DIR/aapt" dump badging output/UnityGlobal-Drive-Portal-v2.6-unsigned.apk > output/unsigned-badging.txt
          grep -q "package: name='com.unityglobal.unity_drive_access' versionCode='7' versionName='1.0.6'" output/unsigned-badging.txt
          unzip -t output/UnityGlobal-Drive-Portal-v2.6-unsigned.apk > /dev/null
          sha256sum output/UnityGlobal-Drive-Portal-v2.6-unsigned.apk > output/unsigned.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: UnityGlobal-Drive-Portal-v2.6-clean-unsigned-and-tools
          path: output
          if-no-files-found: error
          retention-days: 7
